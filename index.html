<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniTrack — University Application Tracker</title>
  <meta name="description" content="Track your university applications, courses, requirements, and deadlines in one beautiful dashboard.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/kanban.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>

  <!-- Loading -->
  <div id="app-loading" class="app-loading">
    <div class="spinner"></div>
    <span>Loading UniTrack...</span>
  </div>

  <!-- Auth -->
  <div id="auth-container" class="auth-container" style="display:none"></div>

  <!-- App -->
  <div class="app-layout" style="display:none">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon">🎓</span>
        <span class="logo-text">UniTrack</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>
        <a href="#kanban" class="nav-item" data-view="kanban">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="5" height="16" rx="1"/></svg>
          Board
        </a>
        <a href="#table" class="nav-item" data-view="table">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
          Table
        </a>
      </nav>
      <div class="sidebar-footer">
        <div style="padding:4px 12px;font-size:0.72rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis" id="user-email"></div>
        <button id="btn-export">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export JSON
        </button>
        <button id="btn-import">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Import JSON
        </button>
        <button onclick="App.logout()" style="color:var(--danger)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log Out
        </button>
      </div>
    </aside>

    <main id="main-content" class="main-content">
      <header class="topbar">
        <button id="btn-sidebar-toggle" class="sidebar-toggle">☰</button>
        <div class="search-container">
          <input type="text" id="global-search" placeholder="Search universities, courses..." autocomplete="off">
        </div>
        <div class="topbar-actions">
          <div class="dropdown" id="add-dropdown">
            <button class="btn-primary" onclick="document.getElementById('add-menu').classList.toggle('open')">+ Add New</button>
            <div class="dropdown-menu" id="add-menu">
              <button class="dropdown-item" onclick="App.showModal('addUniversity');document.getElementById('add-menu').classList.remove('open')">🏛️ University</button>
              <button class="dropdown-item" onclick="App.showModal('addCourse');document.getElementById('add-menu').classList.remove('open')">📚 Course</button>
            </div>
          </div>
        </div>
      </header>
      <div id="view-dashboard" class="view active"></div>
      <div id="view-kanban" class="view"></div>
      <div id="view-table" class="view"></div>
    </main>
  </div>

  <div id="side-panel" class="side-panel"></div>
  <div id="panel-overlay" class="panel-overlay"></div>
  <div id="modal-overlay" class="modal-overlay"><div id="modal-container" class="modal-container"></div></div>
  <div id="toast-container" class="toast-container"></div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App Scripts -->
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/kanban.js"></script>
  <script src="js/table.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
